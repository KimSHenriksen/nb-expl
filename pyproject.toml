[project]
name = "nb-expl"
version = "0.1.0"
description = "Local web app that explains Databricks notebooks with cited, verifiable documentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.55",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.34",
]

[project.scripts]
nb-expl = "nb_expl.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nb_expl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
